name: VocalEdge AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Server checks
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Run Server Tests
        run: |
          cd server
          npm test

      # Client checks
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Client Linting
        run: |
          cd client
          npm run lint

      - name: Build Client
        run: |
          cd client
          npm run build
